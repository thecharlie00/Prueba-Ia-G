  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#1d1a3a" stroke-width="8"/>
  <ellipse cx="128" cy="196" rx="92" ry="26" fill="#4f9c84"/>
  <ellipse cx="128" cy="196" rx="92" ry="26" fill="none" stroke="#1d1a3a" stroke-width="6"/>
  <!-- ficha -->
